# Target: probe ~every 2h. Hourly cron attempts + throttle (skip if ran <100m ago).
name: Live probe every 2h
on:
  schedule:
    # every hour two slots — GH often skips some; throttle keeps ~2h real cadence
    - cron: '5 * * * *'
    - cron: '35 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [live-probe, probe]

concurrency:
  group: live-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout private app (scripts)
        uses: actions/checkout@v4
        with:
          repository: Reed3130/AVK-VPN-private
          token: ${{ secrets.AVK_BUILD_TOKEN }}
          path: app-src

      - name: Throttle ~2h for schedule only
        if: github.event_name == 'schedule'
        working-directory: app-src
        run: |
          set -e
          STATUS=scripts/live_probe/status.json
          if [ -f "$STATUS" ]; then
            # last run unix if present
            python3 - <<'PY'
import json, time, sys
from pathlib import Path
p = Path("scripts/live_probe/status.json")
try:
    d = json.loads(p.read_text())
except Exception:
    sys.exit(0)
# support several keys
ts = d.get("ts") or d.get("updated") or d.get("time") or d.get("last_run")
if ts is None:
    sys.exit(0)
if isinstance(ts, str):
    # try parse ISO
    from datetime import datetime
    try:
        t = datetime.fromisoformat(ts.replace("Z","+00:00")).timestamp()
    except Exception:
        sys.exit(0)
else:
    t = float(ts)
    if t > 1e12:  # ms
        t /= 1000.0
age_min = (time.time() - t) / 60.0
print(f"last probe age_min={age_min:.1f}")
if age_min < 100:
    print("throttle: skip schedule (need ~2h)")
    # exit 0 with skip marker for next step
    Path("/tmp/probe_skip").write_text("1")
else:
    Path("/tmp/probe_skip").write_text("0")
PY
          else
            echo 0 > /tmp/probe_skip
          fi
          if [ "$(cat /tmp/probe_skip 2>/dev/null || echo 0)" = "1" ]; then
            echo "SKIP_PROBE=1" >> "$GITHUB_ENV"
          fi

      - name: Setup Python
        if: env.SKIP_PROBE != '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run probe_live.py
        if: env.SKIP_PROBE != '1'
        working-directory: app-src
        env:
          GH_TOKEN: ${{ secrets.AVK_BUILD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AVK_BUILD_TOKEN }}
        run: |
          set -e
          echo "probe start $(date -u +%Y-%m-%dT%H:%M:%SZ) event=${{ github.event_name }}"
          python3 scripts/live_probe/probe_live.py
          echo "--- status ---"
          cat scripts/live_probe/status.json || true
          wc -l live.txt || true

      - name: Commit live.txt to private if changed
        if: env.SKIP_PROBE != '1'
        working-directory: app-src
        env:
          GH_TOKEN: ${{ secrets.AVK_BUILD_TOKEN }}
        run: |
          git config user.email "avk-builder@users.noreply.github.com"
          git config user.name "AVK Builder"
          git add live.txt scripts/live_probe/status.json || true
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: live.txt probe (avk-builder 2h)"
            git push "https://x-access-token:${GH_TOKEN}@github.com/Reed3130/AVK-VPN-private.git" HEAD:main
          fi

      - name: Schedule note
        if: env.SKIP_PROBE == '1'
        run: echo "Skipped by 2h throttle (schedule)"
