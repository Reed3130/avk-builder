name: Live probe every 2h
on:
  schedule:
    - cron: "5 * * * *"
    - cron: "35 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [live-probe, probe]

concurrency:
  group: live-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout private app
        uses: actions/checkout@v4
        with:
          repository: Reed3130/AVK-VPN-private
          token: ${{ secrets.AVK_BUILD_TOKEN }}
          path: app-src

      - name: Throttle schedule to ~2h
        id: throttle
        if: github.event_name == 'schedule'
        working-directory: app-src
        run: |
          python3 -c '
          import json, time
          from pathlib import Path
          p = Path("scripts/live_probe/status.json")
          skip = False
          if p.is_file():
              try:
                  d = json.loads(p.read_text())
                  t = d.get("ts") or 0
                  if t > 1e12:
                      t = t / 1000.0
                  age = (time.time() - float(t)) / 60.0
                  print(f"age_min={age:.1f}")
                  if age < 100:
                      skip = True
              except Exception as e:
                  print("status parse", e)
          print("skip" if skip else "run")
          Path("/tmp/probe_skip").write_text("1" if skip else "0")
          '
          if [ "$(cat /tmp/probe_skip)" = "1" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: github.event_name != 'schedule' || steps.throttle.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run probe
        if: github.event_name != 'schedule' || steps.throttle.outputs.skip != 'true'
        working-directory: app-src
        env:
          GH_TOKEN: ${{ secrets.AVK_BUILD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AVK_BUILD_TOKEN }}
        run: |
          set -e
          echo "probe start $(date -u +%Y-%m-%dT%H:%M:%SZ) event=${{ github.event_name }}"
          python3 scripts/live_probe/probe_live.py
          cat scripts/live_probe/status.json || true
          wc -l live.txt || true

      - name: Commit live.txt
        if: github.event_name != 'schedule' || steps.throttle.outputs.skip != 'true'
        working-directory: app-src
        env:
          GH_TOKEN: ${{ secrets.AVK_BUILD_TOKEN }}
        run: |
          git config user.email "avk-builder@users.noreply.github.com"
          git config user.name "AVK Builder"
          git add live.txt scripts/live_probe/status.json || true
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: live.txt probe (avk-builder 2h)"
            git push "https://x-access-token:${GH_TOKEN}@github.com/Reed3130/AVK-VPN-private.git" HEAD:main
          fi
