name: Build AVK-VPN release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-avk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private app
        uses: actions/checkout@v4
        with:
          repository: Reed3130/AVK-VPN-private
          token: ${{ secrets.AVK_BUILD_TOKEN }}
          path: app-src
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant gradlew
        run: chmod +x app-src/gradlew
      - name: Assemble release
        working-directory: app-src
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleRelease --no-daemon
      - name: Find APK
        id: apk
        run: |
          APK=$(find app-src -name 'app-release*.apk' -type f | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -la "$APK"
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app-src/app/build.gradle.kts | head -1)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: avk-vpn-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
      - name: Create private release
        env:
          GH_TOKEN: ${{ secrets.AVK_BUILD_TOKEN }}
        run: |
          VER="${{ steps.apk.outputs.version }}"
          TAG="v${VER}"
          APK="${{ steps.apk.outputs.path }}"
          OUT="AVK-VPN-${VER}.apk"
          cp "$APK" "$OUT"
          # delete old tag/release if exists then recreate
          gh release delete "$TAG" --repo Reed3130/AVK-VPN-private --yes 2>/dev/null || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/Reed3130/AVK-VPN-private.git" ":refs/tags/${TAG}" 2>/dev/null || true
          gh release create "$TAG" "$OUT" \
            --repo Reed3130/AVK-VPN-private \
            --title "AVK-VPN ${VER}" \
            --notes "Release ${VER} built via public avk-builder (unlimited Actions minutes). Includes isCoreRunnable insecure VLESS filter and prior fixes."
          # keep only 2 releases
          gh release list --repo Reed3130/AVK-VPN-private --limit 20 | awk '{print $1}' | tail -n +3 | while read t; do
            gh release delete "$t" --repo Reed3130/AVK-VPN-private --yes 2>/dev/null || true
          done
