name: Build AVK-VPN release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-avk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private app
        uses: actions/checkout@v4
        with:
          repository: Reed3130/AVK-VPN-private
          token: ${{ secrets.AVK_BUILD_TOKEN }}
          path: app-src
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK cmdline
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          rm -rf "$HOME/android-sdk/cmdline-tools/latest"
          mv cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
      - name: Accept licenses and install packages
        run: |
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses >/tmp/sdk-lic.txt || true
          sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Grant gradlew
        run: chmod +x app-src/gradlew
      - name: Assemble release
        working-directory: app-src
        run: |
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Find APK
        id: apk
        run: |
          APK=$(find app-src -name 'app-release*.apk' -type f | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -la "$APK"
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app-src/app/build.gradle.kts | head -1)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: avk-vpn-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
      - name: Create private release
        env:
          GH_TOKEN: ${{ secrets.AVK_BUILD_TOKEN }}
        run: |
          set -e
          VER="${{ steps.apk.outputs.version }}"
          TAG="v${VER}"
          APK="${{ steps.apk.outputs.path }}"
          OUT="AVK-VPN-${VER}.apk"
          cp "$APK" "$OUT"
          # install gh if needed
          which gh || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && sudo apt-get update -qq && sudo apt-get install -y -qq gh)
          gh release delete "$TAG" --repo Reed3130/AVK-VPN-private --yes 2>/dev/null || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/Reed3130/AVK-VPN-private.git" ":refs/tags/${TAG}" 2>/dev/null || true
          gh release create "$TAG" "$OUT" \
            --repo Reed3130/AVK-VPN-private \
            --title "AVK-VPN ${VER}" \
            --notes "Release ${VER} via public avk-builder CI. isCoreRunnable rejects insecure public VLESS; prior stop/notification/white fixes included."
          # keep only 2 releases
          mapfile -t tags < <(gh release list --repo Reed3130/AVK-VPN-private --limit 20 | awk '{print $3}' | sed 's/^v/v/;s/"//g')
          # gh release list columns vary; use JSON
          gh api repos/Reed3130/AVK-VPN-private/releases --jq '.[].tag_name' | tail -n +3 | while read t; do
            gh release delete "$t" --repo Reed3130/AVK-VPN-private --yes 2>/dev/null || true
          done
