name: Build AVK-VPN release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-avk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
    steps:
      - name: Checkout private app
        uses: actions/checkout@v4
        with:
          repository: Reed3130/AVK-VPN-private
          token: ${{ secrets.AVK_BUILD_TOKEN }}
          path: app-src
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android commandlinetools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install SDK packages
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
      - name: Verify native cores
        working-directory: app-src
        run: |
          ls -lh libv2ray/libv2ray.aar hev-socks5-tunnel/hev-socks5-tunnel.aar
          test -f libv2ray/libv2ray.aar
          test -f hev-socks5-tunnel/hev-socks5-tunnel.aar
      - name: Grant gradlew
        run: chmod +x app-src/gradlew
      - name: Ensure debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Assemble release
        working-directory: app-src
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Do NOT overwrite gradle.properties — only ensure heap + AndroidX flags
          if grep -q '^org.gradle.jvmargs=' gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8/' gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' >> gradle.properties
          fi
          grep -q 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -q 'android.enableJetifier=' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties
          echo '--- gradle.properties ---'
          cat gradle.properties
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Find APK
        id: apk
        run: |
          APK=$(find app-src -name 'app-release*.apk' -type f | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -la "$APK"
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app-src/app/build.gradle.kts | head -1)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: avk-vpn-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
      - name: Create private release
        env:
          GH_TOKEN: ${{ secrets.AVK_BUILD_TOKEN }}
        run: |
          set -e
          VER="${{ steps.apk.outputs.version }}"
          TAG="v${VER}"
          APK="${{ steps.apk.outputs.path }}"
          OUT="AVK-VPN-${VER}.apk"
          cp "$APK" "$OUT"
          sudo apt-get update -qq && sudo apt-get install -y -qq gh >/dev/null 2>&1 || true
          gh release delete "$TAG" --repo Reed3130/AVK-VPN-private --yes 2>/dev/null || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/Reed3130/AVK-VPN-private.git" ":refs/tags/${TAG}" 2>/dev/null || true
          gh release create "$TAG" "$OUT" \
            --repo Reed3130/AVK-VPN-private \
            --title "AVK-VPN ${VER}" \
            --notes "Release ${VER} via public avk-builder CI. Includes isCoreRunnable insecure VLESS filter and prior fixes."
          gh api repos/Reed3130/AVK-VPN-private/releases --jq '.[].tag_name' | tail -n +3 | while read t; do
            gh release delete "$t" --repo Reed3130/AVK-VPN-private --yes 2>/dev/null || true
          done
